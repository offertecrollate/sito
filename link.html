<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Crea link – Offerte Crollate</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0b0b;color:#fff;font:16px/1.45 system-ui,-apple-system,sans-serif;padding:20px}
main{max-width:560px;margin:0 auto}h1{font-size:22px;margin:4px 0 4px}p.s{color:#aaa;margin:0 0 18px;font-size:14px}
textarea{width:100%;min-height:96px;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;resize:vertical}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font:inherit;font-weight:700;padding:13px 16px;border:0;border-radius:12px;cursor:pointer;background:#2a2a2a;color:#fff;flex:1}
button.k{background:#e30613}button.ok{background:#1f9d55}
#out{margin-top:18px;padding:14px;border-radius:12px;background:#151515;border:1px solid #2a2a2a;display:none}
#out b{display:block;margin-bottom:6px}#res{word-break:break-all;font-size:14px;color:#ffd400}
#msg{margin-top:8px;font-size:14px;color:#ccc}.err{color:#ff7b7b!important}
small{display:block;color:#777;margin-top:22px;font-size:13px;line-height:1.5}
</style></head><body><main>
<h1>Crea link affiliato</h1>
<p class="s">Incolla il link del prodotto copiato dal negozio: ti do il link con la tua affiliazione.</p>
<textarea id="in" placeholder="https://www.amazon.it/…  oppure  https://www.maxisport.com/…"></textarea>
<div class="row"><button type="button" onclick="incolla()">📋 Incolla</button><button type="button" class="k" onclick="crea()">Crea link</button></div>
<div id="out"><b id="shop"></b><div id="res"></div><p id="msg"></p>
<div class="row"><button type="button" class="ok" id="cp" onclick="copia()">Copia link</button><button type="button" id="sh" onclick="condividi()">Condividi</button><button type="button" onclick="window.open(R,'_blank')">Apri</button></div></div>
<small>Negozi: Amazon.it, Maxi Sport, Moulinex, Onestreet, Celebre Store, Acer Store.<br>AliExpress: il link va creato dal portale affiliati (portals.aliexpress.com), qui non si può.</small>
</main><script>
var TAG="offertecrolla-21",AFF="3152592",R="";
var AW=[["maxisport.com","Maxi Sport",9923],["moulinex.it","Moulinex",9450],["onestreet.it","Onestreet",128805],["celebrestore.com","Celebre Store",118201],["store.acer.com","Acer Store",15530]];
function $(i){return document.getElementById(i)}
function incolla(){if(navigator.clipboard&&navigator.clipboard.readText)navigator.clipboard.readText().then(function(t){$("in").value=t;crea()}).catch(function(){$("in").focus()});else $("in").focus()}
function estrai(t){var m=String(t).match(/https?:\/\/[^\s"'<>]+/i);return m?m[0]:""}
function mostra(shop,link,msg,err){$("out").style.display="block";$("shop").textContent=shop;$("res").textContent=link;R=link;
 $("msg").textContent=msg||"";$("msg").className=err?"err":"";$("cp").textContent="Copia link";
 ["cp","sh"].forEach(function(b){$(b).style.display=link?"":"none"});if(!navigator.share)$("sh").style.display="none"}
function crea(){var raw=estrai($("in").value);if(!raw){mostra("","","Non trovo un link: copia l'indirizzo della pagina del prodotto.",1);return}
 var u;try{u=new URL(raw)}catch(e){mostra("","","Link non valido.",1);return}
 var h=u.hostname.replace(/^www\./,"").replace(/^m\./,"");
 if(/(^|\.)amazon\.(it|de|fr|es|com)$/.test(h)){var m=u.pathname.match(/\/(?:dp|gp\/product|gp\/aw\/d|d)\/([A-Z0-9]{10})/i);
  if(m){mostra("Amazon","https://www."+h+"/dp/"+m[1].toUpperCase()+"?tag="+TAG,h!="amazon.it"?"Attenzione: la tua affiliazione è su Amazon.it.":"");return}
  u.searchParams.set("tag",TAG);mostra("Amazon",u.toString(),"Non è la pagina di un prodotto: ho aggiunto il tuo codice al link.");return}
 if(/^(amzn\.(eu|to)|a\.co)$/.test(h)){mostra("Amazon","","Questo è un link accorciato di Amazon: aprilo, poi copia l'indirizzo della pagina del prodotto e incollalo qui.",1);return}
 if(/aliexpress\./.test(h)||/^s\.click\.aliexpress/.test(h)){mostra("AliExpress","","Per AliExpress il link affiliato si crea da portals.aliexpress.com (o dall'app, Condividi → affiliati).",1);return}
 for(var i=0;i<AW.length;i++){var d=AW[i][0];if(h==d||h.slice(-d.length-1)=="."+d){
  ["awc","utm_source","utm_medium","utm_campaign","gclid","fbclid"].forEach(function(p){u.searchParams.delete(p)});
  mostra(AW[i][1],"https://www.awin1.com/cread.php?awinmid="+AW[i][2]+"&awinaffid="+AFF+"&clickref=manuale&ued="+encodeURIComponent(u.toString()),"");return}}
 if(/awin1\.com$/.test(h)){mostra("Awin",raw,"È già un link affiliato.");return}
 mostra(h,"","Questo negozio non è tra quelli affiliati.",1)}
function copia(){var ok=function(){$("cp").textContent="✓ Copiato"};
 if(navigator.clipboard)navigator.clipboard.writeText(R).then(ok).catch(fb);else fb();
 function fb(){var t=document.createElement("textarea");t.value=R;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();ok()}}
function condividi(){navigator.share({url:R}).catch(function(){})}
$("in").addEventListener("paste",function(){setTimeout(crea,50)});
</script></body></html>
