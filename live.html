<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Offerte Crollate – Live</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#070707;overflow:hidden;font-family:system-ui,sans-serif}
#st{position:relative;height:100vh;aspect-ratio:9/16;max-width:100vw;margin:0 auto}
iframe{width:100%;height:100%;border:0;display:block;background:#070707}
#tag{position:absolute;bottom:14px;left:14px;background:#ff2d2d;color:#fff;font-weight:900;font-size:13px;padding:4px 10px;border-radius:99px;pointer-events:none;z-index:3;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.55}}
#info{position:fixed;left:8px;bottom:8px;color:#777;font-size:12px;max-width:calc(50vw - 30vh);line-height:1.5}
#info b{color:#ccc}
</style></head><body>
<div id="st"><iframe id="f" src="/"></iframe><span id="tag">● LIVE</span></div>
<p id="info"><b>Live automatica</b><br>Il sito cerca da solo prodotti a caso.<br>Quando qualcuno chiede un prodotto nei commenti, clicca nella ricerca del sito e scrivilo tu: il giro automatico si ferma.<br>Dopo <b>90 secondi</b> senza che tocchi niente, riparte da solo.<br><span id="stato"></span></p>
<script>
var PAUSA=90000,ultimo=0,auto=false,parole=[],F=document.getElementById("f");
var BASE=["cuffie","tv","smartphone","ps5","monitor","ipad","scarpe","giacca","zaino","friggitrice","caffè","cioccolato","aspirapolvere","robot","orologio","tablet","notebook","mouse","tastiera","casse","lego","borraccia","sneakers","felpa","trapano","lampada","caricatore","power bank","videocamera","occhiali"];
function W(){return F.contentWindow}function D(){try{return F.contentDocument}catch(e){return null}}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function stato(t){document.getElementById("stato").textContent=t}
function utente(){return Date.now()-ultimo<PAUSA}
function aggancia(){var d=D();if(!d)return;
 ["keydown","mousedown","touchstart","wheel"].forEach(function(ev){d.addEventListener(ev,function(e){if(e.isTrusted){ultimo=Date.now();stato("⏸ in pausa: stai usando tu il sito")}},true)});
 var st=d.createElement("style");st.textContent=".totop{display:none!important}";d.head.appendChild(st);
 fetch("/deals.json?"+Date.now()).then(function(r){return r.json()}).then(function(j){
  var w={};j.forEach(function(x){String(x.name).toLowerCase().split(/[^a-zàèéìòù0-9]+/).forEach(function(p){if(p.length>4&&!/^\d+$/.test(p))w[p]=(w[p]||0)+1})});
  parole=Object.keys(w).filter(function(p){return w[p]>=4&&w[p]<80})}).catch(function(){})}
F.addEventListener("load",function(){aggancia();if(!auto){auto=true;giro()}});
async function scrivi(q,txt){q.focus({preventScroll:true});q.value="";q.dispatchEvent(new Event("input",{bubbles:true}));
 for(var i=0;i<txt.length;i++){if(utente())return false;q.value+=txt[i];q.dispatchEvent(new Event("input",{bubbles:true}));await sleep(140+Math.random()*120)}
 q.blur();return true}
async function scorri(ms){var w=W(),t0=Date.now(),y0=w.scrollY;var g=D().getElementById("grid");
 var max=g?Math.max(0,g.getBoundingClientRect().bottom+w.scrollY-w.innerHeight):D().body.scrollHeight;
 var fine=Math.min(max,y0+w.innerHeight*4);
 while(Date.now()-t0<ms){if(utente())return false;var f=(Date.now()-t0)/ms;w.scrollTo(0,y0+(fine-y0)*f);await sleep(40)}return true}
async function giro(){
 while(true){
  if(utente()){await sleep(1000);continue}
  var d=D(),q=d&&d.getElementById("q");if(!q){await sleep(1000);continue}
  stato("▶ giro automatico");
  var pool=BASE.concat(parole.slice(0,120)),t=pool[Math.floor(Math.random()*pool.length)];
  W().scrollTo({top:0,behavior:"smooth"});await sleep(1500);
  if(!await scrivi(q,t))continue;
  var n=d.querySelectorAll("#grid .deal:not(.hidden):not([hidden])").length;
  if(!d.getElementById("empty")||!d.getElementById("empty").classList.contains("hidden")){await sleep(2500);continue}
  await sleep(2500);if(!await scorri(14000))continue;await sleep(2000);
 }}
</script></body></html>
